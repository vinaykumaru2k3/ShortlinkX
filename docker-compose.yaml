# Secrets come from .env (copy .env.example). Nothing but the frontend (4200) and the gateway (8080) is published
# to the network; databases and Redis are bound to localhost for debugging, shortlink-service is internal only.
services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: shortlink_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5430:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - shortlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortlink_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-url:
    image: postgres:16-alpine
    container_name: postgres-url
    environment:
      POSTGRES_DB: shortlinkx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5431:5432"
    volumes:
      - postgres_url_data:/var/lib/postgresql/data
    networks:
      - shortlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortlinkx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shortlink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/shortlink_auth
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SHORTLINK_SERVICE_URI: http://shortlink-service:8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shortlink-network

  shortlink-service:
    build:
      context: .
      dockerfile: shortlink-service/Dockerfile
    container_name: shortlink-service
    # Not published: it trusts the X-User-Id header, so only the gateway may reach it.
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-url:5432/shortlinkx
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_SHORT_URL_PREFIX: ${APP_SHORT_URL_PREFIX:-http://localhost:8080/api/v1/}
    depends_on:
      postgres-url:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shortlink-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:8080"
    depends_on:
      - api-gateway
    networks:
      - shortlink-network

networks:
  shortlink-network:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_url_data:
  redis_data:
