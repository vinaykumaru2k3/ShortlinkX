server:
  port: 8081

spring:
  application:
    name: shortlink-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shortlinkx
    username: ${DB_USERNAME:postgres}
    # "postgres" is only the stock password of a throwaway local database; docker compose supplies a real one.
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  # Public base URL of the gateway's redirect endpoint (must end with a slash).
  short-url-prefix: ${APP_SHORT_URL_PREFIX:http://localhost:8080/api/v1/}
