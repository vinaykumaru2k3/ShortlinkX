server:
  port: 8081

spring:
  application:
    name: shortlink-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shortlinkx
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  short-url-prefix: http://localhost:8080/api/v1/
