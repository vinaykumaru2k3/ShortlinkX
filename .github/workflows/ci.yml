name: ShortLinkX Continuous Integration

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Verify Maven Modules
      run: |
        chmod +x mvnw
        ./mvnw clean verify -DskipTests=false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Docker Compose Build
      run: |
        cp .env.example .env
        sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-secret-ci-only-secret-ci-only-secret/;s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/;s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci/' .env
        docker compose config
        docker compose build --no-cache api-gateway shortlink-service

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npm run build
