server:
  port: 8080

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  datasource:
    url: jdbc:postgresql://localhost:5432/shortlink_auth
    username: ${DB_USERNAME:postgres}
    # No real default: supply SPRING_DATASOURCE_PASSWORD / DB_PASSWORD (see .env.example). "postgres" is only
    # the stock password of a throwaway local database.
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

# Routes live in GatewayConfig.java.
resilience4j:
  circuitbreaker:
    instances:
      shortlinkServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

app:
  jwt:
    # Required, at least 32 bytes. Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    enabled: true
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
